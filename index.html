<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garmin Performance Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #1f2937;
      --accent: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      color: var(--accent);
    }
    .grid-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }
    .metric-val {
      font-size: 28px;
      font-weight: 800;
      margin: 6px 0;
    }
    .grid-insights {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 768px) {
      .grid-insights { grid-template-columns: 1fr; }
    }
    .insight-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .insight-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .insight-body {
      font-size: 14px;
      line-height: 1.5;
      color: #d1d5db;
    }
    .grid-charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 768px) {
      .grid-charts { grid-template-columns: 1fr; }
    }
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Garmin Coach AI</div>
      <div id="sync-time" style="font-size: 12px; color: var(--text-muted);">Syncing...</div>
    </div>

    <!-- METRICS -->
    <div class="grid-metrics">
      <div class="metric-card">
        <div class="metric-label">Readiness</div>
        <div class="metric-val" id="val-readiness">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Sleep Score</div>
        <div class="metric-val" id="val-sleep">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">HRV</div>
        <div class="metric-val" id="val-hrv">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Body Battery</div>
        <div class="metric-val" id="val-bb">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">SpO2</div>
        <div class="metric-val" id="val-spo2">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Stress</div>
        <div class="metric-val" id="val-stress">--</div>
      </div>
    </div>

    <!-- INSIGHTS -->
    <div class="grid-insights">
      <div class="insight-card">
        <div class="insight-title">🎯 Today's Workout Analysis</div>
        <div class="insight-body" id="workout-analysis">Loading analysis...</div>
      </div>
      <div class="insight-card">
        <div class="insight-title">📅 7-Day Training Forecast</div>
        <div class="insight-body" id="weekly-forecast">Loading forecast...</div>
      </div>
    </div>

    <!-- CHARTS -->
    <div class="grid-charts">
      <div class="chart-card">
        <div class="insight-title">🌙 Sleep Quality Trend</div>
        <canvas id="sleepChart"></canvas>
      </div>
      <div class="chart-card">
        <div class="insight-title">🫀 HRV Status Trend</div>
        <canvas id="hrvChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const response = await fetch('garmin_data.json?cache=' + Date.now());
        if (!response.ok) throw new Error("JSON file missing");
        const data = await response.json();

        // Update Sync Info
        document.getElementById('sync-time').innerText = 'Synced ' + (data.sync_time || 'recently');

        // Update Metrics
        document.getElementById('val-readiness').innerText = data.readiness || '--';
        document.getElementById('val-sleep').innerText = data.sleep_score || '--';
        document.getElementById('val-hrv').innerText = (data.hrv_status || '--') + ' ms';
        document.getElementById('val-bb').innerText = data.body_battery || '--';
        document.getElementById('val-spo2').innerText = (data.spo2 || '--') + '%';
        document.getElementById('val-stress').innerText = data.stress || '--';

        // Update AI Insights
        document.getElementById('workout-analysis').innerText = data.today_workout_analysis || "No analysis generated.";
        document.getElementById('weekly-forecast').innerText = data.weekly_forecast || "No forecast generated.";

        // Render Charts
        const dates = data.history_dates || ["09-20", "09-21", "09-22", "09-23", "09-24", "09-25", "09-26"];

        new Chart(document.getElementById('sleepChart'), {
          type: 'bar',
          data: {
            labels: dates,
            datasets: [{
              label: 'Sleep Score',
              data: data.sleep_history || [76, 78, 75, 68, 78, 72, 74],
              backgroundColor: '#10b981',
              borderRadius: 4
            }]
          },
          options: { plugins: { legend: { display: false } }, responsive: true }
        });

        new Chart(document.getElementById('hrvChart'), {
          type: 'line',
          data: {
            labels: dates,
            datasets: [{
              label: 'HRV (ms)',
              data: data.hrv_history || [101, 103, 104, 104, 105, 102, 99],
              borderColor: '#06b6d4',
              backgroundColor: 'rgba(6, 182, 212, 0.1)',
              tension: 0.4,
              fill: true
            }]
          },
          options: { plugins: { legend: { display: false } }, responsive: true }
        });

      } catch (err) {
        console.error(err);
        document.getElementById('workout-analysis').innerText = "Could not load garmin_data.json. Run export_garmin_data.py to generate it.";
        document.getElementById('weekly-forecast').innerText = "Could not load garmin_data.json. Run export_garmin_data.py to generate it.";
      }
    }

    loadDashboard();
  </script>
</body>
</html>
